services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: notifyfin_test
      POSTGRES_USER: notifyfin
      POSTGRES_PASSWORD: notifyfin_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifyfin -d notifyfin_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes:
      - ./api/test/fixtures/postgres-init.sql:/docker-entrypoint-initdb.d/001-create-unmigrated-database.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
